name: Update 威力彩 + 大樂透 results

on:
  schedule:
    # Tirages 20:30 heure de Taïwan (12:30 UTC), résultats publiés vers 21:00-21:30 :
    # passages ciblés 21:05 → 23:35 Taïwan, puis un passage toutes les 6 h en filet de sécurité
    - cron: "5,35 13-15 * * *"
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch results (official Taiwan Lottery API)
        run: python3 scripts/tw_results.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "actions@github.com"
          git add tw_results.json
          if ! git diff --cached --quiet; then
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "No change."
          fi
